<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
	<title>On Air Clock</title>
	<!-- Clock action: the studio clock's dot ring from the app icon, lit from 12 to 8 o'clock, with a hub. -->
	<g fill="#FFFFFF">
		<circle cx="10.00" cy="2.50" r="1.45"/>
		<circle cx="13.75" cy="3.50" r="1.45"/>
		<circle cx="16.50" cy="6.25" r="1.45"/>
		<circle cx="17.50" cy="10.00" r="1.45"/>
		<circle cx="16.50" cy="13.75" r="1.45"/>
		<circle cx="13.75" cy="16.50" r="1.45"/>
		<circle cx="10.00" cy="17.50" r="1.45"/>
		<circle cx="6.25" cy="16.50" r="1.45"/>
		<circle cx="3.50" cy="13.75" r="1.45"/>
		<circle cx="2.50" cy="10.00" r="0.8"/>
		<circle cx="3.50" cy="6.25" r="0.8"/>
		<circle cx="6.25" cy="3.50" r="0.8"/>
		<circle cx="10" cy="10" r="1.7"/>
	</g>
</svg>
